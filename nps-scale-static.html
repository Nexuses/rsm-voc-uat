<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPS Scale</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#009CDE;--green:#3F9C35;--midnight:#00153D;--dg:#63666A;--mg:#888B8D;--lg:#CCCFCF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:#fff;color:var(--midnight);padding:40px 16px}

.nps{max-width:820px;margin:0 auto;border:0}
.nps-q{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:28px}

.nps-regions,.nps-scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}

/* Regions: one face each, spanning their numbers */
.region{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:10px;margin-bottom:10px;border-bottom:3px solid currentColor;transition:opacity .2s}
.region.det{grid-column:span 7;color:var(--dg)}
.region.neu{grid-column:span 2;color:var(--blue)}
.region.pro{grid-column:span 2;color:var(--green)}
.region svg{width:44px;height:44px;transition:transform .2s}
.r-name{font-size:12px;font-weight:700}
.r-range{font-weight:500;color:var(--mg)}

/* After a pick: active region pops, others dim (pure CSS) */
.nps:has(input:checked) .region{opacity:.3}
.nps:has(input.det:checked) .region.det,
.nps:has(input.neu:checked) .region.neu,
.nps:has(input.pro:checked) .region.pro{opacity:1}
.nps:has(input.det:checked) .region.det svg,
.nps:has(input.neu:checked) .region.neu svg,
.nps:has(input.pro:checked) .region.pro svg{transform:scale(1.25)}

/* Number buttons */
.nps-scale input{position:absolute;opacity:0;pointer-events:none}
.nps-scale label{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--lg);border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;background:#fff;transition:.15s}
.nps-scale label.det{color:var(--dg)}
.nps-scale label.neu{color:var(--blue)}
.nps-scale label.pro{color:var(--green)}
.nps-scale label:hover{border-color:currentColor}
.nps-scale input:focus-visible+label{outline:2px solid var(--blue);outline-offset:2px}
.nps-scale input:checked+label{color:#fff;border-color:transparent}
.nps-scale input.det:checked+label{background:var(--dg)}
.nps-scale input.neu:checked+label{background:var(--blue)}
.nps-scale input.pro:checked+label{background:var(--green)}

@media(max-width:520px){
  .nps-q{font-size:18px}
  .region svg{width:32px;height:32px}
  .nps-scale label{height:38px;font-size:12px}
  .nps-regions,.nps-scale{gap:3px}
}
</style>
</head>
<body>

<fieldset class="nps">
  <legend class="nps-q">On a scale from 0 to 10, how likely are you to recommend RSM in Kuwait to a colleague or business associate?</legend>

  <div class="nps-regions" aria-hidden="true">
    <div class="region det">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M8 16.5q4-3.5 8 0"/></svg>
      <span class="r-name">Detractors <span class="r-range">(0–6)</span></span>
    </div>
    <div class="region neu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M8.5 15.5h7"/></svg>
      <span class="r-name">Neutral <span class="r-range">(7–8)</span></span>
    </div>
    <div class="region pro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M7.5 14q4.5 4.5 9 0"/></svg>
      <span class="r-name">Promoters <span class="r-range">(9–10)</span></span>
    </div>
  </div>

  <div class="nps-scale">
    <input type="radio" name="nps" id="nps-0"  value="0"  class="det"><label for="nps-0"  class="det">0</label>
    <input type="radio" name="nps" id="nps-1"  value="1"  class="det"><label for="nps-1"  class="det">1</label>
    <input type="radio" name="nps" id="nps-2"  value="2"  class="det"><label for="nps-2"  class="det">2</label>
    <input type="radio" name="nps" id="nps-3"  value="3"  class="det"><label for="nps-3"  class="det">3</label>
    <input type="radio" name="nps" id="nps-4"  value="4"  class="det"><label for="nps-4"  class="det">4</label>
    <input type="radio" name="nps" id="nps-5"  value="5"  class="det"><label for="nps-5"  class="det">5</label>
    <input type="radio" name="nps" id="nps-6"  value="6"  class="det"><label for="nps-6"  class="det">6</label>
    <input type="radio" name="nps" id="nps-7"  value="7"  class="neu"><label for="nps-7"  class="neu">7</label>
    <input type="radio" name="nps" id="nps-8"  value="8"  class="neu"><label for="nps-8"  class="neu">8</label>
    <input type="radio" name="nps" id="nps-9"  value="9"  class="pro"><label for="nps-9"  class="pro">9</label>
    <input type="radio" name="nps" id="nps-10" value="10" class="pro"><label for="nps-10" class="pro">10</label>
  </div>
</fieldset>

</body>
</html>

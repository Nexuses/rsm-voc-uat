<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPS Slider</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#009CDE;--green:#3F9C35;--midnight:#00153D;--dg:#63666A;--mg:#888B8D;--lg:#CCCFCF;--c:var(--lg)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:#fff;color:var(--midnight);padding:40px 16px}

.nps{max-width:820px;margin:0 auto;border:0}
.nps-q{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:28px}
.nps[data-region="det"]{--c:var(--dg)}
.nps[data-region="neu"]{--c:var(--blue)}
.nps[data-region="pro"]{--c:var(--green)}

/* Face + readout */
.readout{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.face{width:96px;height:96px;flex-shrink:0;color:var(--c);transition:color .25s}
.face.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.15)}}
.face path{transition:d .2s ease}
.r-score{font-size:44px;font-weight:900;line-height:1;color:var(--c);transition:color .25s}
.r-name{font-size:14px;font-weight:700;margin-top:4px;color:var(--c);transition:color .25s}
.r-hint{font-size:12px;color:var(--mg);margin-top:2px}

/* Region bands */
.bands{display:grid;grid-template-columns:7fr 2fr 2fr;gap:4px;margin:0 2px 8px;font-size:11px;font-weight:700}
.band{padding-bottom:6px;border-bottom:3px solid currentColor;opacity:.35;transition:opacity .2s}
.band.det{color:var(--dg)}.band.neu{color:var(--blue)}.band.pro{color:var(--green)}
.nps:not([data-region]) .band,
.nps[data-region="det"] .band.det,
.nps[data-region="neu"] .band.neu,
.nps[data-region="pro"] .band.pro{opacity:1}

/* Slider */
.slider{position:relative;padding:0 2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--c) 0 var(--p,0%),#E6E8EA var(--p,0%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:border-color .25s,transform .15s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.2)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:6px}

/* Tappable ticks */
.ticks{display:flex;justify-content:space-between;margin-top:12px}
.ticks button{width:28px;height:28px;border:0;background:none;font:600 13px 'Inter',Arial,sans-serif;color:var(--mg);cursor:pointer;border-radius:4px;transition:.15s}
.ticks button:hover{color:var(--midnight)}
.ticks button.on{background:var(--c);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mg);margin-top:6px}

@media(max-width:520px){
  .nps-q{font-size:18px}
  .face{width:72px;height:72px}
  .r-score{font-size:34px}
  .ticks button{width:22px;font-size:11px}
}
</style>
</head>
<body>

<fieldset class="nps" id="nps">
  <legend class="nps-q">On a scale from 0 to 10, how likely are you to recommend RSM in Kuwait to a colleague or business associate?</legend>

  <div class="readout" aria-live="polite">
    <svg class="face" id="face" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="9" cy="10" r="1" fill="currentColor"/>
      <circle cx="15" cy="10" r="1" fill="currentColor"/>
      <path id="mouth" d="M8 15.5 Q12 15.5 16 15.5"/>
    </svg>
    <div>
      <div class="r-score" id="score">–</div>
      <div class="r-name" id="rname">Not rated yet</div>
      <div class="r-hint" id="rhint">Drag the slider or tap a number</div>
    </div>
  </div>

  <div class="bands" aria-hidden="true">
    <div class="band det">Detractors (0–6)</div>
    <div class="band neu">Neutral (7–8)</div>
    <div class="band pro">Promoters (9–10)</div>
  </div>

  <div class="slider">
    <input type="range" id="range" min="0" max="10" step="1" value="5" aria-label="Likelihood to recommend, 0 to 10">
    <div class="ticks" id="ticks"></div>
    <div class="ends"><span>Not at all likely</span><span>Extremely likely</span></div>
  </div>

  <!-- Only gets a value once the person actually rates -->
  <input type="hidden" name="nps" id="nps-value">
</fieldset>

<script>
  const nps = document.getElementById('nps');
  const range = document.getElementById('range');
  const face = document.getElementById('face');
  const mouth = document.getElementById('mouth');
  const ticks = document.getElementById('ticks');
  const hidden = document.getElementById('nps-value');
  const REG = {
    det:{name:'Detractor', hint:'Sorry to hear that. Tell us what we could do better.'},
    neu:{name:'Neutral',   hint:'Thanks. What would make it a 9 or 10?'},
    pro:{name:'Promoter',  hint:'Thank you! We appreciate your confidence.'}
  };
  const regionOf = n => n <= 6 ? 'det' : n <= 8 ? 'neu' : 'pro';

  for (let n = 0; n <= 10; n++)
    ticks.insertAdjacentHTML('beforeend', `<button type="button" data-n="${n}" aria-label="Rate ${n}">${n}</button>`);

  function set(n) {
    const r = regionOf(n);
    if (nps.dataset.region !== r) { face.classList.remove('pop'); void face.offsetWidth; face.classList.add('pop'); }
    nps.dataset.region = r;
    range.value = n;
    range.style.setProperty('--p', n * 10 + '%');
    hidden.value = n;
    // Mouth morphs continuously: frown at 0, flat around 5, smile at 10
    const edge = 15.5 - n * 0.15, ctrl = 11.5 + n * 0.8;
    mouth.setAttribute('d', `M8 ${edge} Q12 ${ctrl} 16 ${edge}`);
    document.getElementById('score').textContent = n;
    document.getElementById('rname').textContent = REG[r].name;
    document.getElementById('rhint').textContent = REG[r].hint;
    ticks.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  }

  range.addEventListener('input', () => set(+range.value));
  ticks.addEventListener('click', e => { if (e.target.dataset.n) set(+e.target.dataset.n); });
</script>
</body>
</html>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=1280\">\n<title>RSM UAE — Design System v3<\u002Ftitle>\n\n<style>\n/* ============================================================\n   RSM UAE — Design System\n   Sourced from official RSM International brand files.\n   Calibri throughout. Navy + RSM Green + RSM Blue palette.\n   ============================================================ */\n\n:root {\n  /* Primary */\n  --navy:     #00153D;   /* Covers, headers, dark panels, table headers */\n  --green:    #3F9C35;   /* RSM Green — badges, accent, CTA, card strips */\n  --blue:     #009CDE;   /* RSM Blue — icons, borders, charts, links */\n\n  /* Text */\n  --charcoal: #231F20;\n  --bodyText: #63666A;\n  --midGrey:  #919093;\n  --logoGrey: #888B8D;\n\n  /* Surfaces */\n  --white:     #FFFFFF;\n  --pageBg:    #F6F6F6;\n  --blueTint:  #E5F5FC;\n  --greenTint: #EBF5EA;\n\n  /* Borders */\n  --border:   #D1D3D4;\n  --divider:  #E0E0E0;\n\n  /* Semantic */\n  --caution:  #E07B39;\n  --negative: #C8102E;\n\n  /* Type */\n  --font: \"Calibri\", \"Segoe UI\", -apple-system, system-ui, Arial, sans-serif;\n  --font-email: Arial, Helvetica, sans-serif;\n\n  --container: 1200px;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: var(--font);\n  font-size: 15px;\n  line-height: 1.55;\n  color: var(--bodyText);\n  background: var(--pageBg);\n  -webkit-font-smoothing: antialiased;\n}\nh1,h2,h3,h4,h5 { font-family: var(--font); color: var(--charcoal); margin: 0; }\np { margin: 0; }\na { color: var(--blue); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 3px; }\ncode { font-family: \"Consolas\", \"Menlo\", monospace; font-size: 12px; background: var(--white); padding: 1px 6px; border: 1px solid var(--border); color: var(--charcoal);}\n\n/* ============ Page chrome ============ */\n.topbar {\n  height: 32px;\n  background: var(--navy);\n  color: #fff;\n  font-size: 12px;\n  display: flex; align-items: center;\n}\n.topbar .wrap { max-width: var(--container); margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; width: 100%; opacity: 0.85; }\n\n/* ============ Brand: RSM logo (grey sq + blue sq + wordmark) ============ */\n.rsm-logo { display: inline-flex; align-items: center; gap: 0; vertical-align: middle; }\n.rsm-logo .sq-grey { width: 22px; height: 22px; background: var(--logoGrey); }\n.rsm-logo .sq-blue { width: 22px; height: 22px; background: var(--blue); }\n.rsm-logo .word { font-family: \"Calibri\", sans-serif; font-weight: 700; font-size: 18px; color: var(--navy); letter-spacing: 0.02em; padding: 0 8px 0 10px; }\n.rsm-logo.on-dark .word { color: #fff; }\n.rsm-logo.lg .sq-grey, .rsm-logo.lg .sq-blue { width: 34px; height: 34px; }\n.rsm-logo.lg .word { font-size: 26px; padding: 0 10px 0 12px; }\n.rsm-logo.xl .sq-grey, .rsm-logo.xl .sq-blue { width: 48px; height: 48px; }\n.rsm-logo.xl .word { font-size: 36px; padding: 0 14px 0 16px; }\n.rsm-logo.sm .sq-grey, .rsm-logo.sm .sq-blue { width: 16px; height: 16px; }\n.rsm-logo.sm .word { font-size: 13px; padding: 0 6px 0 8px; }\n\n/* ============ Main nav ============ */\n.nav {\n  position: sticky; top: 0; z-index: 50;\n  background: #fff; border-bottom: 1px solid var(--divider);\n}\n.nav .wrap { max-width: var(--container); margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 32px; }\n.nav ul { list-style: none; padding: 0; margin: 0 0 0 auto; display: flex; gap: 28px; }\n.nav a.navlink { color: var(--charcoal); font-weight: 600; font-size: 14px; padding: 4px 0; border-bottom: 2px solid transparent; }\n.nav a.navlink.active, .nav a.navlink:hover { color: var(--green); border-bottom-color: var(--green); text-decoration: none; }\n\nmain { max-width: var(--container); margin: 0 auto; padding: 0 24px; }\n\n/* ============ Section badge (SIGNATURE ELEMENT) ============ */\n.badge {\n  display: inline-block;\n  background: var(--green);\n  color: #fff;\n  font-family: \"Calibri\", sans-serif;\n  font-weight: 700;\n  font-size: 13px;\n  padding: 6px 12px;\n  border-radius: 4px;\n  letter-spacing: 0.02em;\n}\n.badge.blue { background: var(--blue); }\n.badge.navy { background: var(--navy); }\n\n/* ============ Hero ============ */\n.hero {\n  background: #fff;\n  border-bottom: 1px solid var(--divider);\n  padding: 64px 0 56px;\n}\n.hero .eye { font-size: 12px; color: var(--midGrey); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;}\n.hero h1 { font-size: 44px; font-weight: 700; color: var(--charcoal); line-height: 1.15; margin-top: 16px; max-width: 22ch; }\n.hero h1 span { color: var(--green); }\n.hero .lead { font-size: 18px; color: var(--bodyText); margin-top: 20px; max-width: 52ch; line-height: 1.5;}\n.hero .meta-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); margin-top: 40px; border: 1px solid var(--border); }\n.hero .meta-row > div { background: #fff; padding: 16px 20px; }\n.hero .meta-row .k { font-size: 11px; color: var(--midGrey); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;}\n.hero .meta-row .v { font-size: 16px; color: var(--charcoal); font-weight: 700; margin-top: 2px; font-family: \"Consolas\", monospace; letter-spacing: 0.02em;}\n\n/* ============ Sections ============ */\nsection.band { background: #fff; border-bottom: 1px solid var(--divider); padding: 64px 0; }\nsection.band.tint { background: var(--pageBg); }\nsection.band.dark { background: var(--navy); color: #fff; border-bottom: none; }\nsection.band.dark h2, section.band.dark h3, section.band.dark h4 { color: #fff; }\nsection.band.dark p { color: #DDEEFF; }\n\n.section-head { display: grid; grid-template-columns: 200px 1fr; gap: 48px; margin-bottom: 40px; align-items: start; }\n.section-head .num { color: var(--midGrey); font-size: 12px; letter-spacing: 0.1em; font-family: \"Consolas\", monospace; }\n.section-head .num .bar { display: inline-block; width: 32px; height: 1px; background: var(--border); vertical-align: middle; margin: 0 8px; }\n.section-head h2 { font-size: 30px; font-weight: 700; color: var(--charcoal); line-height: 1.2;}\n.section-head h2 span { color: var(--green); }\n.section-head p { font-size: 15px; color: var(--bodyText); max-width: 62ch; margin-top: 12px; line-height: 1.55;}\nsection.band.dark .section-head h2 { color: #fff; }\nsection.band.dark .section-head h2 span { color: var(--green); }\nsection.band.dark .section-head p { color: #BCCADB; }\nsection.band.dark .section-head .num { color: #93A3B8; }\n\n/* ============ Anchor strip ============ */\n.anchor-strip {\n  background: #fff;\n  border-top: 1px solid var(--divider);\n  border-bottom: 1px solid var(--divider);\n  padding: 10px 0;\n  font-size: 12px;\n  display: flex; gap: 24px; align-items: center;\n  overflow-x: auto;\n  font-family: \"Consolas\", monospace;\n}\n.anchor-strip a { color: var(--bodyText); white-space: nowrap; }\n.anchor-strip a:hover { color: var(--green); text-decoration: none; }\n\n/* ============ Grids ============ */\n.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n\n/* ============ Swatch ============ */\n.swatch {\n  border: 1px solid var(--border);\n  background: #fff;\n  overflow: hidden;\n}\n.swatch .chip { height: 120px; position: relative; display: flex; align-items: flex-end; padding: 12px; color: rgba(255,255,255,0.9); font-size: 12px; font-family: \"Consolas\", monospace;}\n.swatch .chip.light { color: var(--charcoal); }\n.swatch .meta { padding: 10px 14px; border-top: 1px solid var(--divider); display: flex; justify-content: space-between; font-family: \"Consolas\", monospace; font-size: 12px;}\n.swatch .meta .name { color: var(--charcoal); font-weight: 600; }\n.swatch .meta .hex { color: var(--midGrey); }\n.swatch .meta .role { display: block; font-size: 11px; color: var(--midGrey); margin-top: 2px; font-family: var(--font); font-weight: 400;}\n\n/* ============ Type specimens ============ */\n.spec { display: grid; grid-template-columns: 200px 1fr; gap: 32px; padding: 20px 0; border-top: 1px solid var(--divider); align-items: baseline;}\n.spec:last-child { border-bottom: 1px solid var(--divider); }\n.spec .k { font-family: \"Consolas\", monospace; font-size: 12px; color: var(--midGrey); }\n.spec .k b { display: block; font-family: var(--font); color: var(--charcoal); font-weight: 700; font-size: 13px; margin-bottom: 4px;}\n\n/* ============ Cards ============ */\n.card-rsm {\n  background: #fff;\n  border: 1px solid var(--border);\n  padding: 20px;\n}\n.card-rsm.top-green { border-top: 3px solid var(--green); }\n.card-rsm.top-blue { border-top: 3px solid var(--blue); }\n.card-rsm.left-green { border-left: 4px solid var(--green); }\n.card-rsm.left-blue { border-left: 4px solid var(--blue); }\n.card-rsm h4 { font-size: 15px; font-weight: 700; color: var(--green); margin-bottom: 8px; }\n.card-rsm.top-blue h4, .card-rsm.left-blue h4 { color: var(--blue); }\n.card-rsm p { font-size: 14px; color: var(--bodyText); line-height: 1.5; }\n\n.card-tint-green { background: var(--greenTint); padding: 20px; border: 1px solid var(--border); }\n.card-tint-green h4 { font-size: 15px; font-weight: 700; color: var(--green); margin-bottom: 8px; }\n.card-tint-blue { background: var(--blueTint); padding: 20px; border: 1px solid var(--border); }\n.card-tint-blue h4 { font-size: 15px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }\n\n/* ============ Tables (RSM style) ============ */\ntable.rsm-tbl { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }\ntable.rsm-tbl thead th { background: var(--navy); color: #fff; font-weight: 700; font-size: 12px; padding: 10px 14px; text-align: left; border: 0.5px solid var(--border);}\ntable.rsm-tbl tbody td { padding: 10px 14px; border: 0.5px solid var(--border); color: var(--bodyText); vertical-align: top;}\ntable.rsm-tbl tbody tr:nth-child(even) td { background: var(--pageBg); }\ntable.rsm-tbl .num { text-align: right; font-variant-numeric: tabular-nums; }\n\n/* ============ Tier rows (navy number column) ============ */\n.tier { display: grid; grid-template-columns: 80px 1fr 2fr; border: 1px solid var(--border); background: #fff; margin-bottom: 8px;}\n.tier .n { background: var(--navy); color: #fff; font-size: 28px; font-weight: 700; display: grid; place-items: center;}\n.tier .hd { padding: 14px 18px; border-right: 1px solid var(--border); font-size: 14px; font-weight: 700; color: var(--charcoal); display: flex; align-items: center;}\n.tier .body { padding: 14px 18px; font-size: 13px; color: var(--bodyText); display: flex; align-items: center;}\n\n/* ============ Phase rows ============ */\n.phase { display: grid; grid-template-columns: 120px 1fr 2fr; margin-bottom: 8px; align-items: stretch;}\n.phase .lab { background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; padding: 14px 16px; display: flex; align-items: center;}\n.phase .hd { padding: 14px 18px; font-size: 14px; font-weight: 700; color: var(--charcoal);}\n.phase.g .hd { background: var(--greenTint); }\n.phase.b .hd { background: var(--blueTint); }\n.phase .body { padding: 14px 18px; font-size: 13px; color: var(--bodyText); background: #fff; border: 1px solid var(--border);}\n.phase .body ul { margin: 0; padding-left: 18px; }\n.phase .body li + li { margin-top: 4px; }\n\n/* ============ Buttons ============ */\n.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font); font-weight: 700; font-size: 13px; padding: 10px 18px; border: 1px solid transparent; cursor: pointer; border-radius: 4px; transition: background 0.15s;}\n.btn-primary { background: var(--green); color: #fff; }\n.btn-primary:hover { background: #337c2a; color: #fff; text-decoration: none; }\n.btn-secondary { background: #fff; color: var(--navy); border-color: var(--navy); }\n.btn-secondary:hover { background: var(--navy); color: #fff; text-decoration: none; }\n.btn-ghost { background: transparent; color: var(--blue); padding: 0; border: none; border-bottom: 1px solid var(--blue); border-radius: 0; padding-bottom: 1px;}\n.btn-ghost:hover { color: var(--navy); border-color: var(--navy); text-decoration: none;}\n\n/* ============ Form fields ============ */\n.field { display: flex; flex-direction: column; gap: 6px; }\n.field label { font-size: 13px; font-weight: 700; color: var(--charcoal); }\n.field .hint { font-size: 12px; color: var(--midGrey); }\n.input, .select, .textarea {\n  font: inherit; width: 100%; height: 40px;\n  padding: 0 12px; border: 1px solid var(--border); background: #fff; color: var(--charcoal);\n  border-radius: 4px;\n}\n.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,156,53,0.15); }\n.textarea { height: auto; padding: 10px 12px; min-height: 88px; resize: vertical;}\n\n/* ============ Logo usage plates ============ */\n.plates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n.plate { aspect-ratio: 4/3; border: 1px solid var(--border); display: grid; place-items: center; position: relative; background: #fff;}\n.plate.dark { background: var(--navy); border-color: var(--navy); }\n.plate.tint { background: var(--pageBg); }\n.plate.img { background:\n  linear-gradient(135deg, rgba(0,21,61,0.7), rgba(0,21,61,0.5)),\n  repeating-linear-gradient(45deg, #5a6378 0 8px, #6b7488 8px 9px);\n}\n.plate .lbl { position: absolute; top: 8px; left: 8px; font-family: \"Consolas\", monospace; font-size: 10px; color: var(--midGrey); letter-spacing: 0.06em; text-transform: uppercase;}\n.plate.dark .lbl, .plate.img .lbl { color: rgba(255,255,255,0.7); }\n\n/* ============ Naming table ============ */\n.naming { width: 100%; border-collapse: collapse; back  font-size: 2.6cqw; z-index: 2;}\n.a4.cover .date-t { position: absolute; right: 6cqw; bottom: 8cqw; color: #fff; font-size: 2.2cqw; opacity: 0.85; z-index: 2;}\n\n/* Inner page */\n.a4.inner { background: #fff; }\n.a4.inner .hdr { position: absolute; top: 0; left: 0; right: 0; height: 10cqw; padding: 3cqw 6cqw 0; display: flex; justify-content: space-between; align-items: flex-start; }\n.a4.inner .hdr .docname { font-size: 1.8cqw; color: var(--midGrey);}\n.a4.inner .hdr .rule { position: absolute; left: 6cqw; right: 6cqw; top: 9cqw; height: 1px; background: var(--divider);}\n.a4.inner .hdr .rsm-logo .sq-grey, .a4.inner .hdr .rsm-logo .sq-blue { width: 4cqw; height: 4cqw;}\n.a4.inner .hdr .rsm-logo .word { font-size: 3cqw; padding: 0 1.2cqw 0 1.4cqw;}\n.a4.inner .body-a4 { position: absolute; top: 12cqw; bottom: 8cqw; left: 6cqw; right: 6cqw; display: flex; flex-direction: column; gap: 3cqw;}\n.a4.inner .a4-badge { display: inline-block; background: var(--green); color: #fff; font-weight: 700; font-size: 2.2cqw; padding: 1.2cqw 2.4cqw; border-radius: 0.6cqw; align-self: flex-start;}\n.a4.inner h3 { font-size: 3.2cqw; color: var(--charcoal); font-weight: 700; line-height: 1.2;}\n.a4.inner .p { font-size: 2.2cqw; color: var(--bodyText); line-height: 1.5;}\n\n.a4.inner .a4-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; }\n.a4.inner .a4-card { background: #fff; border: 1px solid var(--border); padding: 2.2cqw;}\n.a4.inner .a4-card.g { border-top: 0.8cqw solid var(--green);}\n.a4.inner .a4-card.b { border-top: 0.8cqw solid var(--blue);}\n.a4.inner .a4-card h5 { font-size: 2.4cqw; font-weight: 700; color: var(--green); margin-bottom: 1cqw;}\n.a4.inner .a4-card.b h5 { color: var(--blue); }\n.a4.inner .a4-card p { font-size: 2cqw; color: var(--bodyText); line-height: 1.45;}\n\n.a4.inner .a4-tier { display: grid; grid-template-columns: 12cqw 1fr 2fr; border: 1px solid var(--border); margin-bottom: 1cqw;}\n.a4.inner .a4-tier .n { background: var(--navy); color: #fff; font-size: 6cqw; font-weight: 700; display: grid; place-items: center;}\n.a4.inner .a4-tier .h { padding: 2cqw; font-size: 2.4cqw; font-weight: 700; color: var(--charcoal); border-right: 1px solid var(--border); display: flex; align-items: center;}\n.a4.inner .a4-tier .d { padding: 2cqw; font-size: 2cqw; color: var(--bodyText); display: flex; align-items: center;}\n\n.a4.inner .ftr { position: absolute; left: 6cqw; right: 6cqw; bottom: 3cqw; padding-top: 2cqw; border-top: 1px solid var(--divider); display: flex; justify-content: space-between; font-size: 1.6cqw; color: var(--midGrey);}\n\n/* ============ ARTIFACT: 16:9 Deck ============ */\n.slide {\n  aspect-ratio: 13.33 / 7.5;\n  background: #fff;\n  border: 1px solid var(--border);\n  position: relative;\n  container-type: inline-size;\n  overflow: hidden;\n}\n.slide.navy { background: var(--navy); }\n.slide.pagebg { background: var(--pageBg); }\n.slide .s-logo { position: absolute; top: 2.2cqw; right: 3cqw; z-index: 2;}\n.slide .s-logo .rsm-logo .sq-grey, .slide .s-logo .rsm-logo .sq-blue { width: 3.2cqw; height: 3.2cqw; }\n.slide .s-logo .rsm-logo .word { font-size: 2.4cqw; padding: 0 1cqw 0 1.2cqw;}\n.slide .s-badge { position: absolute; top: 2.2cqw; left: 3cqw; background: var(--green); color: #fff; font-weight: 700; font-size: 1.6cqw; padding: 0.8cqw 1.6cqw; border-radius: 0.4cqw;}\n.slide .s-ftr { position: absolute; left: 3cqw; right: 3cqw; bottom: 2cqw; display: flex; justify-content: space-between; font-size: 1.3cqw; color: var(--midGrey); padding-top: 1cqw; border-top: 1px solid var(--divider);}\n.slide.navy .s-ftr { color: #93A3B8; border-top-color: #22345A;}\n\n/* Cover slide */\n.slide.cover-s { background: var(--navy); overflow: hidden;}\n.slide.cover-s::before {\n  content:\"\"; position: absolute; inset: 0;\n  background:\n    linear-gradient(to right, rgba(0,21,61,0.92), rgba(0,21,61,0.6) 70%, rgba(0,21,61,0.8)),\n    repeating-linear-gradient(135deg, #1a3260 0 18px, #223a6b 18px 19px) r(--blue); }\n\n/* ============ ARTIFACT: Email ============ */\n.email {\n  width: 600px;\n  margin: 0 auto;\n  background: #fff;\n  border: 1px solid var(--border);\n  font-family: var(--font-email);\n}\n.email .email-hdr { background: var(--navy); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;}\n.email .email-hdr .entity-e { color: var(--logoGrey); font-size: 13px; font-weight: 700;}\n.email .email-hdr .rsm-logo .sq-grey, .email .email-hdr .rsm-logo .sq-blue { width: 20px; height: 20px;}\n.email .email-hdr .rsm-logo .word { font-size: 16px; padding: 0 8px 0 10px; color: #fff;}\n.email .accent-strip { height: 8px; background: var(--green);}\n.email .email-hero { background: var(--navy); padding: 32px 28px;}\n.email .email-hero .over { color: var(--green); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;}\n.email .email-hero h2 { color: #fff; font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 10px;}\n.email .email-hero .sub { color: var(--logoGrey); font-size: 13px; margin-top: 10px;}\n.email .email-body { padding: 28px;}\n.email .email-body .pill { display: inline-block; background: var(--green); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.08em;}\n.email .email-body h3 { color: var(--charcoal); font-size: 17px; font-weight: 700; margin-top: 12px; line-height: 1.3;}\n.email .email-body p { color: var(--bodyText); font-size: 14px; line-height: 1.55; margin-top: 12px;}\n.email .cards-e { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 28px 24px; }\n.email .card-e { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--green); padding: 14px;}\n.email .card-e h4 { font-size: 13px; font-weight: 700; color: var(--charcoal); line-height: 1.3;}\n.email .card-e p { font-size: 12px; color: var(--bodyText); margin-top: 6px; line-height: 1.45;}\n.email .cta-e { padding: 4px 28px 28px; }\n.email .cta-e a { display: inline-block; background: var(--green); color: #fff; font-weight: 700; padding: 12px 28px; border-radius: 6px; font-size: 13px; text-decoration: none;}\n.email .divider-e { height: 1px; background: var(--divider);}\n.email .email-ftr { background: var(--navy); padding: 22px 28px; color: var(--logoGrey); font-size: 11px; line-height: 1.6;}\n.email .email-ftr .name-f { color: #fff; font-weight: 700; margin-bottom: 4px;}\n.email .email-ftr a { color: var(--blue); }\n\n/* ============ Contact block ============ */\n.contact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }\n.contact-card { background: #fff; border: 1px solid var(--border); border-top: 3px solid var(--green); padding: 16px;}\n.contact-card h4 { font-size: 13px; color: var(--green); font-weight: 700; margin-bottom: 6px;}\n.contact-card p { font-size: 13px; color: var(--bodyText); line-height: 1.5;}\n\n/* ============ Footer ============ */\n.footer { background: var(--navy); color: var(--logoGrey); padding: 56px 0 24px; margin-top: 64px;}\n.footer .wrap { max-width: var(--container); margin: 0 auto; padding: 0 24px; }\n.footer .top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; padding-bottom: 32px; border-bottom: 1px solid #1a2d55;}\n.footer h5 { color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;}\n.footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px;}\n.footer a { color: var(--logoGrey); font-size: 13px; }\n.footer a:hover { color: #fff; text-decoration: underline; }\n.footer p.desc { color: var(--logoGrey); font-size: 13px; line-height: 1.55; max-width: 36ch; margin-top: 14px;}\n.footer .fine { padding-top: 20px; font-size: 11px; color: #7a8298; line-height: 1.6;}\n\n/* ============ Tweaks panel ============ */\n#tweaks-panel {\n  position: fixed; right: 20px; bottom: 20px; z-index: 200;\n  width: 320px; background: #fff; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.2);\n  font-family: var(--font); display: none;\n}\n#tweaks-panel.on { display: block; }\n#tweaks-panel .t-hd { background: var(--navy); color: #fff; padding: 12px 16px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: center;}\n#tweaks-panel .t-hd .dot { width: 8px; height: 8px; background: var(--green);}\n#tweaks-panel .t-body { padding: 16px; display: flex; flex-direction: column; gap: 16px;}\n#tweaks-panel .t-row label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--midGrey); display: block; margin-bottom: 6px;}\n#tweaks-panel .t-seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border);}\n#tweaks-panel .t-seg button { background: #fff; border: none; padding: 8px; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--bodyText); border-right: 1px solid var(--border);}\n#tweaks-panel .t-seg button:last-child { border-right: none;}\n#tweaks-panel .t-seg button.on { background: var(--green); color: #fff; font-weight: 700;}\n\n/* ============ Small utility ============ */\n.util-note {\n  background: var(--greenTint); border-left: 4px solid var(--green);\n  padding: 14px 18px; font-size: 13px; color: var(--bodyText); margin-top: 20px; border-radius: 0 2px 2px 0;\n}\n.util-note.blue { background: var(--blueTint); border-left-color: var(--blue); }\n.util-note b { color: var(--charcoal); }\n\n/* ============================================================\n   v3 ADDITIONS — Data viz, Infographics, Interactive, Fancy cards,\n   Social templates, Event materials. All maintain the core rule:\n   RSM logo top-right on every artifact.\n   ============================================================ */\n\n/* ============ Data viz ============ */\n.viz-card { background: #fff; border: 1px solid var(--border); padding: 20px; position: relative; }\n.viz-card .viz-hd { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px;}\n.viz-card .viz-hd h4 { font-size: 14px; font-weight: 700; color: var(--charcoal); line-height: 1.3;}\n.viz-card .viz-hd .sub { font-size: 11px; color: var(--midGrey); margin-top: 2px; font-family: \"Consolas\", monospace; letter-spacing: 0.04em;}\n.viz-card .viz-hd .trend { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px; font-family: \"Consolas\", monospace; white-space: nowrap;}\n.viz-card .viz-hd .trend.up { background: var(--greenTint); color: var(--green); }\n.viz-card .viz-hd .trend.down { background: #FBE0DE; color: var(--negative); }\n.viz-card .viz-ft { font-size: 11px; color: var(--midGrey); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--divider); font-family: \"Consolas\", monospace; letter-spacing: 0.03em;}\n\n/* Bar chart */\n.bars { display: grid; grid-template-columns: 60px 1fr 50px; gap: 8px; align-items: center; font-size: 12px;}\n.bars .row { display: contents; }\n.bars .lab { color: var(--bodyText); font-size: 12px;}\n.bars .track { height: 10px; background: var(--pageBg); position: relative; border-radius: 2px;}\n.bars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 2px; }\n.bars .fill.blue { background: var(--blue); }\n.bars .fill.navy { background: var(--navy); }\n.bars .num { font-family: \"Consolas\", monospace; color: var(--charcoal); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; font-size: 12px;}\n\n/* Line chart (SVG) */\n.line-chart svg { display: block; width: 100%; height: auto; }\n.line-chart .grid-l { stroke: var(--divider); stroke-width: 0.5; }\n.line-chart .axis-l { stroke: var(--border); stroke-width: 1; }\n.line-chart .tick-l { font-size: 10px; fill: var(--midGrey); font-family: \"Consolas\", monospace;}\n.line-chart .series-a { fill: none; stroke: var(--green); stroke-width: 2.5; }\n.line-chart .series-b { fill: none; stroke: var(--blue); stroke-width: 2.5; }\n.line-chart .area-a { fill: var(--green); opacity: 0.12; }\n.line-chart .dot { r: 3; fill: #fff; stroke-width: 2; }\n.line-chart .legend-l { display: flex; gap: 20px; margin-top: 10px; font-size: 12px; color: var(--bodyText);}\n.line-chart .legend-l .sw { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 6px;}\n\n/* Donut (SVG) */\n.donut-wrap { display: flex; gap: 20px; align-items: center;}\n.donut-wrap svg { flex: 0 0 140px; }\n.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; font-size: 12px;}\n.donut-legend .item { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--divider);}\n.donut-legend .item:last-child { border-bottom: none; }\n.donut-legend .sw { width: 12px; height: 12px;}\n.donut-legend .lab { color: var(--bodyText);}\n.donut-legend .v { font-family: \"Consolas\", monospace; color: var(--charcoal); font-weight: 700;}\n.donut-center { font-family: \"Calibri\", sans-serif; font-size: 22px; font-weight: 700; fill: var(--charcoal); text-anchor: middle;}\n.donut-center-sub { font-size: 10px; fill: var(--midGrey); text-anchor: middle;}\n\n/* Stacked horizontal bars */\n.stack-bar { display: flex; height: 28px; border: 1px solid var(--border); background: #fff; overflow: hidden;}\n.stack-bar > div { display: flex; align-items: center; padding: 0 10px; color: #fff; font-size: 11px; font-weight: 700; font-family: \"Consolas\", monospace; white-space: nowrap; overflow: hidden;}\n.stack-bar .s-green { background: var(--green);}\n.stack-bar .s-blue { background: var(--blue);}\n.stack-bar .s-navy { background: var(--navy);}\n.stack-bar .s-grey { background: var(--midGrey);}\n\n/* Progress ring */\n.prog-ring { position: relative; width: 100px; height: 100px;}\n.prog-ring svg { transform: rotate(-90deg);}\n.prog-ring .label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: var(--charcoal); font-family: \"Calibri\", sans-serif;}\n.prog-ring .label small { display: block; font-size: 10px; color: var(--midGrey); font-weight: 400; text-align: center; margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase;}\n\n/* Sparkline */\n.spark-card { background: #fff; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 6px;}\n.spark-card .lab-s { font-size: 11px; color: var(--midGrey); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;}\n.spark-card .v-s { font-size: 28px; font-weight: 700; color: var(--charcoal); line-height: 1; font-family: \"Calibri\", sans-serif;}\n.spark-card .delta-s { font-size: 11px; font-family: \"Consolas\", monospace; font-weight: 700;}\n.spark-card .delta-s.up { color: var(--green); }\n.spark-card .delta-s.down { color: var(--negative); }\n.spark-card svg { width: 100%; height: 40px; margin-top: 4px;}\n\n/* Gantt */\n.gantt { background: #fff; border: 1px solid var(--border); padding: 16px;}\n.gantt .g-head { display: grid; grid-template-columns: 140px repeat(12, 1fr); font-size: 10px; color: var(--midGrey); font-family: \"Consolas\", monospace; letter-spacing: 0.04em; padding-bottom: 8px; border-bottom: 1px solid var(--divider); text-transform: uppercase;}\n.gantt .g-head span { text-align: center; border-left: 1px solid var(--divider); padding: 2px 0;}\n.gantt .g-head span:first-child { border-left: none; text-align: left; padding-left: 4px;}\n.gantt .g-row { display: grid; grid-template-columns: 140px repeat(12, 1fr); align-items: center; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 12px; position: relative;}\n.gantt .g-row:last-child { border-bottom: none;}\n.gantt .g-row .lab { color: var(--charcoal); font-weight: 700; font-size: 12px;}\n.gantt .bar-g { position: relative; grid-column: span 12; height: 16px; display: block;}\n.gantt .bar-g span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 8px; font-size: 10px; font-weight: 700; color: #fff; font-family: \"Consolas\", monospace; white-space: nowrap; border-radius: 2px;}\n.gantt .bar-g .g-green { background: var(--green);}\n.gantt .bar-g .g-blue { background: var(--blue);}\n.gantt .bar-g .g-navy { background: var(--navy);}\n\n/* Heatmap */\n.heatmap { display: grid; grid-template-columns: 140px repeat(12, 1fr); gap: 2px; font-size: 11px; font-family: \"Consolas\", monospace;}\n.heatmap .hm-hd { color: var(--midGrey); font-size: 10px; padding: 4px; text-align: center; letter-spacing: 0.04em; text-transform: uppercase;}\n.heatmap .hm-hd.lab { text-align: left; padding-left: 0;}\n.heatmap .hm-row-lab { color: var(--charcoal); font-weight: 700; font-size: 12px; padding: 8px 0; font-family: \"Calibri\", sans-serif;}\n.heatmap .hm-cell { height: 28px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 10px;}\n.heatmap .hm-cell.l0 { background: var(--pageBg); color: var(--midGrey);}\n.heatmap .hm-cell.l1 { background: #DCEFDA; color: var(--green);}\n.heatmap .hm-cell.l2 { background: #91CB8A; color: #fff;}\n.heatmap .hm-cell.l3 { background: var(--green);}\n.heatmap .hm-cell.l4 { background: #2A6E22;}\n\n/* KPI tile */\n.kpi-tile { background: #fff; border: 1px solid var(--border); padding: 20px; position: relative; border-top: 3px solid var(--green);}\n.kpi-tile.blue { border-top-color: var(--blue);}\n.kpi-tile.navy { border-top-color: var(--navy);}\n.kpi-tile .lab { font-size: 11px; color: var(--midGrey); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;}\n.kpi-tile .v { font-size: 36px; font-weight: 700; color: var(--charcoal); line-height: 1; margin-top: 8px; font-family: \"Calibri\", sans-serif;}\n.kpi-tile .v .unit { font-size: 0.5em; color: var(--midGrey); margin-left: 4px;}\n.kpi-tile .delta { display: inline-flex; gap: 4px; align-items: center; margin-top: 10px; font-size: 11px; font-weight: 700; font-family: \"Consolas\", monospace;}\n.kpi-tile .delta.up { color: var(--green);}\n.kpi-tile .delta.down { color: var(--negative);}\n.kpi-tile .delta svg { width: 10px; height: 10px;}\n.kpi-tile .context { font-size: 11px; color: var(--midGrey); margin-top: 2px;}\n\n/* ============ Infographics ============ */\n/* Process flow */\n.proc-flow { display: grid; grid-template-columns: 1fr 20px 1fr 20px 1fr 20px 1fr; align-items: stretch; gap: 0; }\n.proc-flow .step { background: #fff; border: 1px solid var(--border); border-top: 3px solid var(--green); padding: 18px; display: flex; flex-direction: column; gap: 8px;}\n.proc-flow .step .n { font-size: 11px; color: var(--midGrey); font-family: \"Consolas\", monospace; letter-spacing: 0.08em;}\n.proc-flow .step h5 { font-size: 14px; font-weight: 700; color: var(--charcoal);}\n.proc-flow .step p { font-size: 12px; color: var(--bodyText); line-height: 1.45;}\n.proc-flow .arr { display: grid; place-items: center; color: var(--green); font-size: 20px; font-weight: 700;}\n.proc-flow .step.b { border-top-color: var(--blue);}\n.proc-flow .step.n3 { border-top-color: var(--green);}\n.proc-flow .step.n4 { border-top-color: var(--navy);}\n\n/* Pyramid */\n.pyramid { display: flex; flex-direction: column; gap: 4px; align-items: center;}\n.pyramid .p-row { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; align-items: center; width: 100%;}\n.pyramid .p-shape { display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; padding: 14px; text-align: center; clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);}\n.pyramid .p-row:nth-child(1) .p-shape { width: 40%; margin-left: auto; background: var(--navy); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);}\n.pyramid .p-row:nth-child(2) .p-shape { width: 60%; margin-left: auto; background: #1A3260; clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);}\n.pyramid .p-row:nth-child(3) .p-shape { width: 80%; margin-left: auto; background: var(--blue); clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);}\n.pyramid .p-row:nth-child(4) .p-shape { width: 100%; margin-left: auto; background: var(--green); clip-path: none;}\n.pyramid .p-desc h6 { font-size: 13px; font-weight: 700; color: var(--charcoal); margin-bottom: 2px;}\n.pyramid .p-desc p { font-size: 12px; color: var(--bodyText); line-height: 1.45;}\n\n/* Venn */\n.venn-wrap { display: flex; gap: 24px; align-items: center; }\n.venn-wrap .venn { position: relative; width: 280px; height: 200px; flex: 0 0 280px;}\n.venn-wrap .circ { position: absolute; width: 160px; height: 160px; border-radius: 50%; opacity: 0.85; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; text-align: center;}\n.venn-wrap .c1 { left: 0; top: 20px; background: var(--green); mix-blend-mode: multiply;}\n.venn-wrap .c2 { left: 80px; top: 20px; background: var(--blue); mix-blend-mode: multiply;}\n.venn-wrap .c3 { left: 40px; top: 60px; background: var(--navy); mix-blend-mode: multiply; color: #fff;}\n.venn-wrap .venn-legend { flex: 1; display: flex; flex-direction: column; gap: 10px; font-size: 13px;}\n.venn-wrap .venn-legend .row-v { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--divider);}\n.venn-wrap .venn-legend .row-v:last-child { border: none;}\n.venn-wrap .venn-legend .dot-v { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%;}\n.venn-wrap .venn-legend b { color: var(--charcoal); display: block;}\n.venn-wrap .venn-legend span { font-size: 12px; color: var(--bodyText);}\n\n/* Timeline */\n.timeline { position: relative; padding-left: 32px;}\n.timeline::before { content: \"\"; position: absolute; left: 12px; top: 10px; bottom: 10px; width: 2px; background: var(--green);}\n.timeline .tl-row { position: relative; padding: 16px 0 16px 20px; border-bottom: 1px solid var(--divider);}\n.timeline .tl-row:last-child { border-bottom: none;}\n.timeline .tl-row::before { content:\"\"; position: absolute; left: -28px; top: 20px; width: 14px; height: 14px; background: #fff; border: 3px solid var(--green); border-radius: 50%;}\n.timeline .tl-row.b::before { border-color: var(--blue);}\n.timeline .tl-row.n::before { border-color: var(--navy);}\n.timeline .tl-date { font-size: 11px; color: var(--midGrey); font-family: \"Consolas\", monospace; letter-spacing: 0.06em;}\n.timeline .tl-row h5 { font-size: 14px; font-weight: 700; color: var(--charcoal); margin: 4px 0;}\n.timeline .tl-row p { font-size: 13px; color: var(--bodyText);}\n\n/* Quadrant (2×2) */\n.quadrant { position: relative; aspect-ratio: 1; background: #fff; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;}\n.quadrant .q-cell { padding: 20px; border-right: 1px solid var(--divider); border-bottom: 1px solid var(--divider); position: relative;}\n.quadrant .q-cell:nth-child(2) { border-right: none;}\n.quadrant .q-cell:nth-child(3), .quadrant .q-cell:nth-child(4) { border-bottom: none;}\n.quadrant .q-cell:nth-child(4) { border-right: none;}\n.quadrant .q-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 2px; letter-spacing: 0.06em; text-transform: uppercase;}\n.quadrant .q-cell:nth-child(1) .q-tag { background: var(--greenTint); color: var(--green);}\n.quadrant .q-cell:nth-child(2) .q-tag { background: var(--blueTint); color: var(--blue);}\n.quadrant .q-cell:nth-child(3) .q-tag { background: #F4ECE0; color: var(--caution);}\n.quadrant .q-cell:nth-child(4) .q-tag { background: var(--pageBg); color: var(--midGrey);}\n.quadrant h6 { font-size: 13px; font-weight: 700; color: var(--charcoal); margin-top: 8px;}\n.quadrant p { font-size: 12px; color: var(--bodyText); line-height: 1.45; margin-top: 4px;}\n.quadrant .q-axis-x { position: absolute; bottom: -28px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--midGrey); font-family: \"Consolas\", monospace; letter-spacing: 0.06em; text-transform: uppercase;}\n.quadrant .q-axis-y { position: absolute; top: 50%; left: -40px; transform: rotate(-90deg) translateX(50%); transform-origin: right center; font-size: 11px; color: var(--midGrey); font-family: \"Consolas\", monospace; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;}\n\n/* Hub and spoke */\n.hub-spoke { position: relative; aspect-ratio: 16/9; background: #fff; border: 1px solid var(--border);}\n.hub-spoke svg { position: absolute; inset: 0; width: 100%; height: 100%;}\n.hub-spoke .node-h { position: absolute; background: var(--navy); color: #fff; padding: 14px 18px; text-align: center; font-weight: 700; font-size: 13px; z-index: 2; border-radius: 2px;}\n.hub-spoke .node-s { position: absolute; background: #fff; border: 1px solid var(--border); padding: 10px 14px; font-size: 12px; font-weight: 700; color: var(--charcoal); z-index: 2;}\n.hub-spoke .node-s.g { border-top: 3px solid var(--green); color: var(--charcoal);}\n.hub-spoke .node-s.b { border-top: 3px solid var(--blue);}\n\n/* Journey map */\n.journey { display: grid; grid-template-columns: 140px repeat(5, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border);}\n.journey .j-row-lab { background: var(--navy); color: #fff; padding: 14px; font-size: 12px; font-weight: 700; display: flex; align-items: center;}\n.journey .j-head { background: var(--greenTint); color: var(--green); padding: 12px; font-size: 12px; font-weight: 700; text-align: center;}\n.journey .j-cell { background: #fff; padding: 14px; font-size: 12px; color: var(--bodyText); line-height: 1.45;}\n.journey .j-cell b { color: var(--charcoal); display: block; margin-bottom: 4px; font-size: 13px;}\n.journey .j-emotion { background: #fff; padding: 18px 14px; display: grid; place-items: center; font-size: 22px;}\n.journey .j-emotion .bar-e { width: 100%; height: 4px; background: var(--pageBg); position: relative; border-radius: 2px;}\n.journey .j-emotion .bar-e::before { content: \"\"; position: absolute; top: -4px; width: 12px; height: 12px; background: var(--green); border-radius: 50%;}\n\n/* ============ Interactive UI ============ */\n/* Tabs */\n.tabs { background: #fff; border: 1px solid var(--border);}\n.tabs .tabs-nav { display: flex; border-bottom: 1px solid var(--divider); background: var(--pageBg);}\n.tabs .tabs-nav button { background: transparent; border: none; padding: 14px 20px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--bodyText); cursor: pointer; border-bottom: 2px solid transparent; position: relative; top: 1px;}\n.tabs .tabs-nav button.on { background: #fff; color: var(--green); border-bottom-color: var(--green);}\n.tabs .tab-body { padding: 20px; display: none;}\n.tabs .tab-body.on { display: block;}\n.tabs .tab-body h5 { font-size: 14px; font-weight: 700; color: var(--charcoal); margin-bottom: 8px;}\n.tabs .tab-body p { font-size: 13px; color: var(--bodyText); line-height: 1.55;}\n\n/* Accordion */\n.accordion { background: #fff; border: 1px solid var(--border);}\n.accordion .acc-item { border-bottom: 1px solid var(--divider);}\n.accordion .acc-item:last-child { border-bottom: none;}\n.accordion .acc-hd { width: 100%; text-align: left; background: transparent; border: none; padding: 16px 20px; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--charcoal); cursor: pointer; display: flex; justify-content: space-between; align-items: center;}\n.accordion .acc-hd .sign { color: var(--green); font-weight: 700; font-size: 18px; width: 18px; text-align: center; transition: transform 0.2s;}\n.accordion .acc-item.on .acc-hd .sign { transform: rotate(45deg);}\n.accordion .acc-body { max-height: 0; overflow: hidden; transition: max-height 0.25s; }\n.accordion .acc-item.on .acc-body { max-height: 240px;}\n.accordion .acc-body p { padding: 0 20px 16px; font-size: 13px; color: var(--bodyText); line-height: ef=\"#fancy-cards\">09 Fancy cards<\u002Fa>\n    <a href=\"#format-a\">10 A4 Doc<\u002Fa>\n    <a href=\"#format-b\">11 Deck<\u002Fa>\n    <a href=\"#format-c\">12 Email<\u002Fa>\n    <a href=\"#social\">13 Social<\u002Fa>\n    <a href=\"#event\">14 Event<\u002Fa>\n    <a href=\"#copy\">15 Copy rules<\u002Fa>\n    <a href=\"#office\">16 Offices<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- 01 Naming -->\n  <section class=\"band\" id=\"naming\">\n    <div class=\"section-head\">\n      <div class=\"num\">01 <span class=\"bar\"><\u002Fspan> Entity naming<\u002Fdiv>\n      <div>\n        <h2>Get the <span>entity name<\u002Fspan> right every time.<\u002Fh2>\n        <p>Entity naming is non-negotiable and sourced from RSM International brand files. Use exactly as shown. Never substitute, abbreviate or rearrange.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <table class=\"naming\">\n      <thead>\n        <tr><th style=\"width: 140px;\">Territory<\u002Fth><th>Use<\u002Fth><th>Never<\u002Fth><\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr><td><b>Kuwait<\u002Fb><\u002Ftd><td class=\"use\">RSM in Kuwait<\u002Ftd><td><span class=\"avoid\">RSM Kuwait<\u002Fspan> · <span class=\"avoid\">RSM KW<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td><b>UAE<\u002Fb><\u002Ftd><td class=\"use\">RSM UAE<\u002Ftd><td><span class=\"avoid\">RSM in UAE<\u002Fspan> · <span class=\"avoid\">RSM-UAE<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td><b>KSA<\u002Fb><\u002Ftd><td class=\"use\">RSM Saudi Arabia<\u002Ftd><td><span class=\"avoid\">RSM KSA<\u002Fspan> · <span class=\"avoid\">RSM Saudi<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td><b>Region<\u002Fb><\u002Ftd><td class=\"use\">RSM in the MENA region<\u002Ftd><td><span class=\"avoid\">RSM MENA<\u002Fspan><\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n\n    <div class=\"util-note\"><b>Why this matters.<\u002Fb> Entity names appear in covers, footers, email signatures, contact blocks and legal lines. A single inconsistency across a document or campaign undermines the RSM network's collective identity.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 Logo -->\n  <section class=\"band tint\" id=\"logo\">\n    <div class=\"section-head\">\n      <div class=\"num\">02 <span class=\"bar\"><\u002Fspan> Logo<\u002Fdiv>\n      <div>\n        <h2>Grey square · blue square · <span>RSM wordmark<\u002Fspan>.<\u002Fh2>\n        <p>Position: top-right on all pages and slides. On dark (navy) backgrounds use the white wordmark. On light backgrounds use the navy wordmark. When the logo image is unavailable, render \"RSM\" in Calibri Bold 22pt.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"plates\">\n      <div class=\"plate\">\n        <div class=\"lbl\">01 · on white<\u002Fdiv>\n        <div class=\"rsm-logo lg\">\n          <span class=\"sq-grey\"><\u002Fspan>\n          <span class=\"sq-blue\"><\u002Fspan>\n          <span class=\"word\">RSM<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"plate dark\">\n        <div class=\"lbl\">02 · on navy<\u002Fdiv>\n        <div class=\"rsm-logo lg on-dark\">\n          <span class=\"sq-grey\"><\u002Fspan>\n          <span class=\"sq-blue\"><\u002Fspan>\n          <span class=\"word\">RSM<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"plate tint\">\n        <div class=\"lbl\">03 · on pageBg<\u002Fdiv>\n        <div class=\"rsm-logo lg\">\n          <span class=\"sq-grey\"><\u002Fspan>\n          <span class=\"sq-blue\"><\u002Fspan>\n          <span class=\"word\">RSM<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"plate img\">\n        <div class=\"lbl\">04 · on imagery<\u002Fdiv>\n        <div class=\"rsm-logo lg on-dark\">\n          <span class=\"sq-grey\"><\u002Fspan>\n          <span class=\"sq-blue\"><\u002Fspan>\n          <span class=\"word\">RSM<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin: 32px 0 12px; color: var(--charcoal); font-size: 16px; font-weight: 700;\">Logo sizes<\u002Fh3>\n    <div class=\"grid-4\">\n      <div style=\"background: #fff; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <span style=\"font-family: Consolas, monospace; font-size: 11px; color: var(--midGrey);\">XL · covers · 48px squares<\u002Fspan>\n        <div class=\"rsm-logo xl\"><span class=\"sq-grey\"><\u002Fspan><span class=\"sq-blue\"><\u002Fspan><span class=\"word\">RSM<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <span style=\"font-family: Consolas, monospace; font-size: 11px; color: var(--midGrey);\">LG · A4 docs · 34px squares<\u002Fspan>\n        <div class=\"rsm-logo lg\"><span class=\"sq-grey\"><\u002Fspan><span class=\"sq-blue\"><\u002Fspan><span class=\"word\">RSM<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <span style=\"font-family: Consolas, monospace; font-size: 11px; color: var(--midGrey);\">MD · nav / slides · 22px<\u002Fspan>\n        <div class=\"rsm-logo\"><span class=\"sq-grey\"><\u002Fspan><span class=\"sq-blue\"><\u002Fspan><span class=\"word\">RSM<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start;\">\n        <span style=\"font-family: Consolas, monospace; font-size: 11px; color: var(--midGrey);\">SM · email header · 20px<\u002Fspan>\n        <div class=\"rsm-logo sm\"><span class=\"sq-grey\"><\u002Fspan><span class=\"sq-blue\"><\u002Fspan><span class=\"word\">RSM<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"util-note blue\"><b>Placement rule.<\u002Fb> The logo sits at the top-right of every cover, inner page, slide and email. Clear space = 1× the square height on all sides. Do not stack the logo with any other mark.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 Color -->\n  <section class=\"band\" id=\"color\">\n    <div class=\"section-head\">\n      <div class=\"num\">03 <span class=\"bar\"><\u002Fspan> Color system<\u002Fdiv>\n      <div>\n        <h2>Navy anchors. Green accents. <span>Blue supports.<\u002Fspan><\u002Fh2>\n        <p>There is no red in the primary palette. Max three colors per slide or page, excluding white, pageBg and border. Green is the primary accent; blue is secondary; navy is reserved for dark backgrounds.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin-bottom: 12px;\">Primary<\u002Fh3>\n    <div class=\"grid-3\">\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--navy);\">navy<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">navy<\u002Fspan><span class=\"role\">Covers · headers · table headers<\u002Fspan><\u002Fdiv><span class=\"hex\">#00153D<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--green);\">green<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">green<\u002Fspan><span class=\"role\">Badges · CTA · top accent strips<\u002Fspan><\u002Fdiv><span class=\"hex\">#3F9C35<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--blue);\">blue<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">blue<\u002Fspan><span class=\"role\">Icons · borders · charts · hyperlinks<\u002Fspan><\u002Fdiv><span class=\"hex\">#009CDE<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 32px 0 12px;\">Text<\u002Fh3>\n    <div class=\"grid-4\">\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--charcoal);\">charcoal<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">charcoal<\u002Fspan><span class=\"role\">High-contrast headlines<\u002Fspan><\u002Fdiv><span class=\"hex\">#231F20<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--bodyText);\">bodyText<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">bodyText<\u002Fspan><span class=\"role\">Standard body copy on white<\u002Fspan><\u002Fdiv><span class=\"hex\">#63666A<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--midGrey);\">midGrey<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">midGrey<\u002Fspan><span class=\"role\">Captions · labels · footers<\u002Fspan><\u002Fdiv><span class=\"hex\">#919093<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--logoGrey);\">logoGrey<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">logoGrey<\u002Fspan><span class=\"role\">Logo left square · secondary<\u002Fspan><\u002Fdiv><span class=\"hex\">#888B8D<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 32px 0 12px;\">Surfaces<\u002Fh3>\n    <div class=\"grid-4\">\n      <div class=\"swatch\"><div class=\"chip light\" style=\"background: var(--white); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);\">white<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">white<\u002Fspan><span class=\"role\">Cards · doc body<\u002Fspan><\u002Fdiv><span class=\"hex\">#FFFFFF<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip light\" style=\"background: var(--pageBg); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);\">pageBg<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">pageBg<\u002Fspan><span class=\"role\">Slide / page background<\u002Fspan><\u002Fdiv><span class=\"hex\">#F6F6F6<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip light\" style=\"background: var(--blueTint);\">blueTint<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">blueTint<\u002Fspan><span class=\"role\">Blue-accent card fills<\u002Fspan><\u002Fdiv><span class=\"hex\">#E5F5FC<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip light\" style=\"background: var(--greenTint);\">greenTint<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">greenTint<\u002Fspan><span class=\"role\">Green-accent card fills<\u002Fspan><\u002Fdiv><span class=\"hex\">#EBF5EA<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 32px 0 12px;\">Borders &amp; semantic<\u002Fh3>\n    <div class=\"grid-4\">\n      <div class=\"swatch\"><div class=\"chip light\" style=\"background: var(--border);\">border<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">border<\u002Fspan><span class=\"role\">Card · table borders<\u002Fspan><\u002Fdiv><span class=\"hex\">#D1D3D4<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip light\" style=\"background: var(--divider);\">divider<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">divider<\u002Fspan><span class=\"role\">Horizontal rules · footer lines<\u002Fspan><\u002Fdiv><span class=\"hex\">#E0E0E0<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--caution);\">caution<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">caution<\u002Fspan><span class=\"role\">Risk · warning states only<\u002Fspan><\u002Fdiv><span class=\"hex\">#E07B39<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background: var(--negative);\">negative<\u002Fdiv><div class=\"meta\"><div><span class=\"name\">negative<\u002Fspan><span class=\"role\">Critical risk only · never decorative<\u002Fspan><\u002Fdiv><span class=\"hex\">#C8102E<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"util-note\"><b>Color discipline.<\u002Fb> Max 3 colors per slide / page (excluding white, pageBg, border). Green = primary accent. Blue = secondary. Navy = dark backgrounds only. Never use red (negative) decoratively.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 Type -->\n  <section class=\"band tint\" id=\"type\">\n    <div class=\"section-head\">\n      <div class=\"num\">04 <span class=\"bar\"><\u002Fspan> Typography<\u002Fdiv>\n      <div>\n        <h2>Calibri throughout. <span>HTML emails use Arial.<\u002Fspan><\u002Fh2>\n        <p>Single-family system. Calibri for every document, deck and on-screen surface. Arial is the fallback for HTML email where Calibri renders inconsistently across clients.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"spec\">\n      <div class=\"k\"><b>Cover title<\u002Fb>28–36pt · bold<\u002Fdiv>\n      <div style=\"font-size: 44px; font-weight: 700; color: var(--charcoal); line-height: 1.08;\">Moving the UAE mid-market <span style=\"color: var(--green);\">forward<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Section divider<\u002Fb>28pt · bold · white on navy<\u002Fdiv>\n      <div style=\"font-size: 36px; font-weight: 700; color: #fff; background: var(--navy); padding: 16px 20px; line-height: 1.1;\">03 · Pillar Two readiness<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Slide title<\u002Fb>22pt · bold · charcoal<\u002Fdiv>\n      <div style=\"font-size: 28px; font-weight: 700; color: var(--charcoal); line-height: 1.2;\">A staged path to DMTT readiness<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Body heading<\u002Fb>13pt · bold · charcoal<\u002Fdiv>\n      <div style=\"font-size: 17px; font-weight: 700; color: var(--charcoal);\">Our approach to the UAE mid-market<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Body text<\u002Fb>10–12pt · bodyText<\u002Fdiv>\n      <div style=\"font-size: 15px; color: var(--bodyText); line-height: 1.55; max-width: 60ch;\">The UAE's DMTT gaining OECD transitional qualified status gives mid-market groups clearer runway. We work with clients to model impact, close systems gaps and file with confidence.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Card title<\u002Fb>10pt · bold · green<\u002Fdiv>\n      <div style=\"font-size: 14px; font-weight: 700; color: var(--green);\">Tax compliance and advisory<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Stat value<\u002Fb>34pt · bold · blue<\u002Fdiv>\n      <div style=\"font-size: 42px; font-weight: 700; color: var(--blue); line-height: 1;\">97<span style=\"font-size: 0.6em;\">%<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Badge text<\u002Fb>10pt · bold · white on green<\u002Fdiv>\n      <div><span class=\"badge\">SECTION BADGE<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Footer / footnote<\u002Fb>8–9pt · midGrey<\u002Fdiv>\n      <div style=\"font-size: 12px; color: var(--midGrey);\">RSM UAE · Midyear outlook 2026 · Confidential · Page 14 / 32<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spec\">\n      <div class=\"k\"><b>Hyperlink<\u002Fb>bodyText · blue<\u002Fdiv>\n      <div style=\"font-size: 15px; color: var(--bodyText);\">Read the full outlook at <a href=\"#\">www.rsm.ae<\u002Fa>.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 Components -->\n  <section class=\"band\" id=\"components\">\n    <div class=\"section-head\">\n      <div class=\"num\">05 <span class=\"bar\"><\u002Fspan> Components<\u002Fdiv>\n      <div>\n        <h2>The <span>signature badge<\u002Fspan>, cards, tables, tiers and phases.<\u002Fh2>\n        <p>The green section badge is the signature element — use it on every section of every document and slide. Cards come in four variants (top-green, top-blue, tint-green, tint-blue). Tables use a navy header with alternating row fills.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin-bottom: 12px;\">Section badge · signature element<\u002Fh3>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n      <span class=\"badge\">OUR APPROACH<\u002Fspan>\n      <span class=\"badge\">WHY RSM<\u002Fspan>\n      <span class=\"badge\">TAX ADVISORY<\u002Fspan>\n      <span class=\"badge blue\">SECONDARY<\u002Fspan>\n      <span class=\"badge navy\">QUIET VARIANT<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"util-note\"><b>Rule.<\u002Fb> Use green badges. Blue and navy variants are rare exceptions — only when the section falls on a greenTint background or when two consecutive sections need visual separation.<\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 40px 0 12px;\">Buttons<\u002Fh3>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n      <button class=\"btn btn-primary\">Request a conversation<\u002Fbutton>\n      <button class=\"btn btn-primary\">Download the brief<\u002Fbutton>\n      <button class=\"btn btn-secondary\">Learn more<\u002Fbutton>\n      <a href=\"#\" class=\"btn btn-ghost\">Read perspective →<\u002Fa>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 40px 0 12px;\">Cards<\u002Fh3>\n    <div class=\"grid-4\">\n      <div class=\"card-rsm top-green\">\n        <div class=\"badge\" style=\"margin-bottom: 10px;\">ASSURANCE<\u002Fdiv>\n        <h4>Audit and assurance<\u002Fh4>\n        <p>Independent opinions that bring clarity to complex financial statements.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-rsm top-blue\">\n        <div class=\"badge blue\" style=\"margin-bottom: 10px;\">TAX<\u002Fdiv>\n        <h4>Tax compliance and advisory<\u002Fh4>\n        <p>Corporate tax, VAT, Pillar Two and transfer pricing aligned to UAE regulation.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-tint-green\">\n        <h4>Advisory<\u002Fh4>\n        <p>Risk, internal audit and consulting calibrated to the UAE mid-market.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-tint-blue\">\n        <h4>Managed services<\u002Fh4>\n        <p>Outsourced accounting and continuous services for in-country operations.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 40px 0 12px;\">Tables<\u002Fh3>\n    <table class=\"rsm-tbl\">\n      <thead>\n        <tr><th>Service line<\u002Fth><th>Lead partner<\u002Fth><th>Office<\u002Fth><th class=\"num\">Active engagements<\u002Fth><\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr><td>Audit and assurance<\u002Ftd><td>N. Hassan<\u002Ftd><td>Dubai<\u002Ftd><td class=\"num\">142<\u002Ftd><\u002Ftr>\n        <tr><td>Tax compliance and advisory<\u002Ftd><td>S. Patel<\u002Ftd><td>Abu Dhabi ADGM<\u002Ftd><td class=\"num\">98<\u002Ftd><\u002Ftr>\n        <tr><td>Risk advisory<\u002Ftd><td>M. Al-Farsi<\u002Ftd><td>Dubai<\u002Ftd><td class=\"num\">61<\u002Ftd><\u002Ftr>\n        <tr><td>Business advisory<\u002Ftd><td>R. Varma<\u002Ftd><td>Sharjah<\u002Ftd><td class=\"num\">34<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n v><div class=\"j-head\">Scope<\u002Fdiv><div class=\"j-head\">Execute<\u002Fdiv><div class=\"j-head\">Review<\u002Fdiv><div class=\"j-head\">Continue<\u002Fdiv>\n      <div class=\"j-row-lab\">Client need<\u002Fdiv>\n      <div class=\"j-cell\"><b>Understand options<\u002Fb>Seeking credible perspectives on a new regulation.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Define outcome<\u002Fb>Aligning on scope, team and timing.<\u002Fdiv>\n      <div class=\"j-cell\"><b>See progress<\u002Fb>Needs regular, plain updates.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Validate quality<\u002Fb>Confirms work meets commitments.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Stay ahead<\u002Fb>Retains ongoing advisory cadence.<\u002Fdiv>\n      <div class=\"j-row-lab\">RSM action<\u002Fdiv>\n      <div class=\"j-cell\"><b>Perspectives<\u002Fb>Share proportionate, practical perspectives.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Proposal<\u002Fb>Clear scope, team, fee and milestones.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Execute<\u002Fb>Weekly status, risk log, CFO summary.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Close<\u002Fb>Structured lessons log and knowledge transfer.<\u002Fdiv>\n      <div class=\"j-cell\"><b>Advise<\u002Fb>Quarterly calls, regulatory briefings.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"util-note\"><b>When to use each.<\u002Fb> Process flow for sequential work. Pyramid for hierarchy. Venn for overlap. Timeline for dated milestones. Quadrant for prioritisation. Hub and spoke for organisational reach. Journey map for client experience.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 Interactive UI -->\n  <section class=\"band tint\" id=\"interactive\">\n    <div class=\"section-head\">\n      <div class=\"num\">08 <span class=\"bar\"><\u002Fspan> Interactive UI<\u002Fdiv>\n      <div>\n        <h2>Buttons, tabs, accordions, <span>toasts and steppers<\u002Fspan>.<\u002Fh2>\n        <p>For digital surfaces — the www.rsm.ae website, client portals, event mi et groups.<\u002Fh2>\n        <div class=\"sub\">Tax, audit and advisory perspectives on the regulatory shifts shaping the next three years.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"email-body\">\n        <span class=\"pill\">Midyear outlook<\u002Fspan>\n        <h3>Three considerations for the next quarter.<\u002Fh3>\n        <p>Dear reader,<\u002Fp>\n        <p>Our midyear outlook brings together perspectives from across RSM UAE on where Pillar Two stands, how continuous audit is being adopted and how ESG reporting is moving into the operating rhythm.<\u002Fp>\n        <p>We aim to keep each piece proportionate, practical and focused on decisions a finance or audit committee can act on this quarter.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cards-e\">\n        <div class=\"card-e\"><h4>Pillar Two readiness<\u002Fh4><p>A staged path to DMTT readiness for UAE mid-market groups.<\u002Fp><\u002Fdiv>\n        <div class=\"card-e\"><h4>Continuous audit<\u002Fh4><p>Precision and risk reduction for groups that moved early.<\u002Fp><\u002Fdiv>\n        <div class=\"card-e\"><h4>ESG reporting<\u002Fh4><p>From disclosure exercise to operating discipline.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cta-e\"><a href=\"#\">Download the brief<\u002Fa><\u002Fdiv>\n      <div class=\"divider-e\"><\u002Fdiv>\n      <div class=\"email-ftr\">\n        <div class=\"name-f\">RSM UAE · Dubai head office<\u002Fdiv>\n        Offices 3106, 3107, 3109–10, The Burlington Tower, Marasi Drive, Business Bay · PO Box 11855<br>\n        +971 (0)4 554 7423 · <a href=\"#\">www.rsm.ae<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 32px;\">\n      <div class=\"util-note\"><b>Variants.<\u002Fb> Cold outreach — no hero, optional cards, CTA \"Request a conversation\". Webinar — navy hero + 3 agenda cards, CTA \"Register now\". Advisory brief — no hero + 3 takeaway cards, CTA \"Download the brief\". Newsletter — no hero + 2–3 sections with per-section links.<\u002Fdiv>\n      <div class=\"util-note blue\"><b>Subject lines.<\u002Fb> Under 8 words. State topic plainly. Works: \"UAE Corporate Tax — a consideration for [Company]\". Avoid: \"Are you ready?\", \"Don't miss this\", \"Quick question\".<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 Social media templates -->\n  <section class=\"band\" id=\"social\">\n    <div class=\"section-head\">\n      <div class=\"num\">13 <span class=\"bar\"><\u002Fspan> Social media templates<\u002Fdiv>\n      <div>\n        <h2>LinkedIn first. <span>1080 square, 1080×1350 portrait, 1080×1920 story<\u002Fspan>.<\u002Fh2>\n        <p>Calibri throughout. Three-colour rule holds — navy, RSM Green, RSM Blue. Logo bottom-right on every post (small variant, 22pt wide). Handle @rsmuae sits left of logo in Consolas 9pt. Shown below at ~50% scale.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ Podcast ============ -->\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 8px 0 14px;\">Podcast announcements · 1080 × 1080<\u002Fh3>\n    <div class=\"social-wrap\">\n      <div>\n        <div class=\"post sq pod\">\n          <div class=\"pod-hdr\">\n            <div class=\"ser\">The UAE Mid-market Podcast<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pod-wave\">\n            <span style=\"height: 40%;\"><\u002Fspan><span style=\"height: 70%;\"><\u002Fspan><span style=\"height: 55%;\"><\u002Fspan><span style=\"height: 85%;\"><\u002Fspan><span style=\"height: 45%;\"><\u002Fspan><span style=\"height: 75%;\"><\u002Fspan><span style=\"height: 60%;\"><\u002Fspan><span style=\"height: 90%;\"><\u002Fspan><span style=\"height: 50%;\"><\u002Fspan><span style=\"height: 30%;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"pod-num\">14<span>· EPISODE<\u002Fspan><\u002Fdiv>\n          <h3 class=\

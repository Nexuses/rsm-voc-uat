u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"util-note\" style=\"margin-top: 24px;\"><b>Scenario discipline.<\u002Fb> Every post carries handle (@rsmuae, Consolas 9pt) + small RSM logo bottom-right. Category tag top-left in Consolas uppercase. One green accent per post (rule, underline, tick, bar fill). No gradients. No drop shadows. No stock-photo overlays. Adjectives are a last resort.<\u002Fdiv>\n\n    <div class=\"grid-2\" style=\"margin-top: 16px;\">\n      <div class=\"util-note blue\"><b>Copy rules on social.<\u002Fb> Caption &lt; 700 characters. No more than two hashtags. Subject stated plainly in the first line. CTAs: \"Read more\", \"Request a seat\", \"Register\", \"Download\". Never: \"Don't miss!\", \"Quick question?\", \"Excited to share!\"<\u002Fdiv>\n      <div class=\"util-note\"><b>Sizing reference.<\u002Fb> Feed square 1080 × 1080. LinkedIn portrait 1080 × 1350. Story / reel 1080 × 1920. All shown above at approximately 50% scale.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 15 Copy rules -->\n  <section class=\"band\" id=\"copy\">\n    <div class=\"section-head\">\n      <div class=\"num\">15 <span class=\"bar\"><\u002Fspan> Copywriting rules<\u002Fdiv>\n      <div>\n        <h2>Measured, proportionate, <span>plainly stated<\u002Fspan>.<\u002Fh2>\n        <p>No Oxford comma. No em dashes — use colon, comma or full stop. No exclamation marks. Active voice. Sentences under 25 words. Let numbers speak — do not dress statistics with adjectives.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rules\">\n      <div class=\"rule do\"><span class=\"tag\">DO<\u002Fspan>\n        <p><b>Use measured future intent.<\u002Fb> \"We aim to\", \"we seek to\", \"we work with clients to\", \"we remain committed to\".<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rule dont\"><span class=\"tag\">DON'T<\u002Fspan>\n        <p><b>Promise outcomes you cannot control.<\u002Fb> Avoid \"we will\", \"we ensure\", \"we guarantee\", \"we promise\".<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rule do\"><span class=\"tag\">DO<\u002Fspan>\n        <p><b>Let numbers speak.<\u002Fb> \"A CSAT of 97% reflects steady service quality.\"<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rule dont\"><span class=\"tag\">DON'T<\u002Fspan>\n        <p><b>Dress data with adjectives.<\u002Fb> \"A CSAT of 97% confirms our exceptional performance.\"<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rule do\"><span class=\"tag\">DO<\u002Fspan>\n        <p><b>Keep sentences under 25 words.<\u002Fb> Active voice. Plain verbs. One idea per sentence.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rule dont\"><span class=\"tag\">DON'T<\u002Fspan>\n        <p><b>Use em dashes, exclamation marks or Oxford commas.<\u002Fb> \"Tax, audit and advisory\" — not \"tax, audit, and advisory\".<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid-2\" style=\"margin-top: 24px;\">\n      <div class=\"word-cloud banned\">\n        <h4>Banned words<\u002Fh4>\n        <div class=\"chips\">\n          <span class=\"chip\">ensure<\u002Fspan><span class=\"chip\">guarantee<\u002Fspan><span class=\"chip\">world-class<\u002Fspan><span class=\"chip\">best<\u002Fspan><span class=\"chip\">leading<\u002Fspan><span class=\"chip\">unmatched<\u002Fspan><span class=\"chip\">exceptional<\u002Fspan><span class=\"chip\">cutting-edge<\u002Fspan><span class=\"chip\">innovative<\u002Fspan><span class=\"chip\">game-changing<\u002Fspan><span class=\"chip\">disruptive<\u002Fspan><span class=\"chip\">holistic<\u002Fspan><span class=\"chip\">seamless<\u002Fspan><span class=\"chip\">end-to-end<\u002Fspan><span class=\"chip\">thrilled<\u002Fspan><span class=\"chip\">excited<\u002Fspan><span class=\"chip\">proud to announce<\u002Fspan><span class=\"chip\">very<\u002Fspan><span class=\"chip\">highly<\u002Fspan><span class=\"chip\">extremely<\u002Fspan><span class=\"chip\">deeply<\u002Fspan><span class=\"chip\">significantly<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"word-cloud good\">\n        <h4>Preferred vocabulary<\u002Fh4>\n        <div class=\"chips\">\n          <span class=\"chip\">aim<\u002Fspan><span class=\"chip\">plan<\u002Fspan><span class=\"chip\">continue<\u002Fspan><span class=\"chip\">develop<\u002Fspan><span class=\"chip\">maintain<\u002Fspan><span class=\"chip\">support<\u002Fspan><span class=\"chip\">collaborate<\u002Fspan><span class=\"chip\">engage<\u002Fspan><span class=\"chip\">adapt<\u002Fspan><span class=\"chip\">improve<\u002Fspan><span class=\"chip\">assess<\u002Fspan><span class=\"chip\">consider<\u002Fspan><span class=\"chip\">explore<\u002Fspan><span class=\"chip\">review<\u002Fspan><span class=\"chip\">monitor<\u002Fspan><span class=\"chip\">strengthen<\u002Fspan><span class=\"chip\">advance<\u002Fspan><span class=\"chip\">clarify<\u002Fspan><span class=\"chip\">address<\u002Fspan><span class=\"chip\">note<\u002Fspan><span class=\"chip\">observe<\u002Fspan><span class=\"chip\">facilitate<\u002Fspan><span class=\"chip\">navigate<\u002Fspan><span class=\"chip\">align<\u002Fspan><span class=\"chip\">enable<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--midGrey); margin: 32px 0 12px;\">Entity tone<\u002Fh3>\n    <table class=\"rsm-tbl\">\n      <thead><tr><th style=\"width: 140px;\">Entity<\u002Fth><th>Tone<\u002Fth><th>Regulatory frame<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td><b>RSM in Kuwait<\u002Fb><\u002Ftd><td>Measured and formal<\u002Ftd><td>CBK · CORF · Boursa Kuwait<\u002Ftd><\u002Ftr>\n        <tr><td><b>RSM UAE<\u002Fb><\u002Ftd><td>Commercially direct<\u002Ftd><td>DIFC · ADGM · CT · VAT · PDPL · DESC<\u002Ftd><\u002Ftr>\n        <tr><td><b>RSM Saudi Arabia<\u002Fb><\u002Ftd><td>Measured and formal<\u002Ftd><td>PDPL · Vision 2030 · Zakat<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n\n    <div class=\"util-note\"><b>10-second test.<\u002Fb> Before finalising copy: \"Could a CFO at a DIFC-registered company or a senior Kuwaiti government official read this and find it credible and proportionate?\" If yes — ready. If no — identify the word creating hesitation and remove it.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 Office -->\n  <section class=\"band tint\" id=\"office\">\n    <div class=\"section-head\">\n      <div class=\"num\">16 <span class=\"bar\"><\u002Fspan> RSM UAE offices<\u002Fdiv>\n      <div>\n        <h2>Four offices, <span>one practice<\u002Fspan>.<\u002Fh2>\n        <p>Use these exact addresses and phone number in every footer, email signature and closing slide. Website: www.rsm.ae.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"contact-grid\">\n      <div class=\"contact-card\">\n        <h4>Dubai · Head office<\u002Fh4>\n        <p>Offices 3106, 3107, 3109–10, The Burlington Tower, Marasi Drive, Business Bay<br>PO Box 11855<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"contact-card\">\n        <h4>Abu Dhabi · ADGM<\u002Fh4>\n        <p>Floor 14, WeWork Hub 71, Al Khatem Tower, ADGM Square, Al Maryah Island<br>PO Box 46617<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"contact-card\">\n        <h4>Abu Dhabi · Corniche<\u002Fh4>\n        <p>Office 711, Corniche Building, Corniche Road<br>PO Box 73843<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"contact-card\">\n        <h4>Sharjah · Hamriyah Free Zone<\u002Fh4>\n        <p>E-LOB, Office no. E2-115F-58, Hamriyah Free Zone<br>PO Box 41637<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid-2\" style=\"margin-top: 16px;\">\n      <div class=\"contact-card\" style=\"border-top-color: var(--blue);\"><h4 style=\"color: var(--blue);\">Phone<\u002Fh4><p>+971 (0)4 554 7423<\u002Fp><\u002Fdiv>\n      <div class=\"contact-card\" style=\"border-top-color: var(--blue);\"><h4 style=\"color: var(--blue);\">Website<\u002Fh4><p><a href=\"#\">www.rsm.ae<\u002Fa><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"top\">\n      <div>\n        <div class=\"rsm-logo lg on-dark\"><span class=\"sq-grey\"><\u002Fspan><span class=\"sq-blue\"><\u002Fspan><span class=\"word\">RSM<\u002Fspan><\u002Fdiv>\n        <p class=\"desc\">A design system for RSM UAE · decks, capability documents and HTML emails. Sourced from official RSM International brand files.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h5>Foundations<\u002Fh5>\n        <ul>\n          <li><a href=\"#naming\">Entity naming<\u002Fa><\u002Fli>\n          <li><a href=\"#logo\">Logo<\u002Fa><\u002Fli>\n          <li><a href=\"#color\">Color<\u002Fa><\u002Fli>\n          <li><a href=\"#type\">Typography<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h5>Formats<\u002Fh5>\n        <ul>\n          <li><a href=\"#format-a\">A · Capability doc<\u002Fa><\u002Fli>\n          <li><a href=\"#format-b\">B · Deck<\u002Fa><\u002Fli>\n          <li><a href=\"#format-c\">C · Email<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h5>Writing<\u002Fh5>\n        <ul>\n          <li><a href=\"#copy\">Copy rules<\u002Fa><\u002Fli>\n          <li><a href=\"#copy\">Banned words<\u002Fa><\u002Fli>\n          <li><a href=\"#office\">Office details<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fine\">This design system is prepared for RSM UAE internal production reference. Logomark and brand colors are from official RSM International brand files. © 2026 RSM UAE.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- Tweaks panel -->\n<div id=\"tweaks-panel\" aria-hidden=\"true\">\n  <div class=\"t-hd\"><span>Tweaks<\u002Fspan><span class=\"dot\"><\u002Fspan><\u002Fdiv>\n  <div class=\"t-body\">\n    <div class=\"t-row\">\n      <label>Entity<\u002Flabel>\n      <div class=\"t-seg\" data-key=\"entity\">\n        <button data-val=\"uae\">RSM UAE<\u002Fbutton>\n        <button data-val=\"kuwait\">RSM in Kuwait<\u002Fbutton>\n        <button data-val=\"ksa\">RSM Saudi Arabia<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"t-row\">\n      <label>Density<\u002Flabel>\n      <div class=\"t-seg\" data-key=\"density\">\n        <button data-val=\"compact\">Compact<\u002Fbutton>\n        <button data-val=\"comfortable\">Comfortable<\u002Fbutton>\n        <button data-val=\"roomy\">Roomy<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst ENTITY_MAP = {\n  uae: { name: \"RSM UAE\", phone: \"+971 (0)4 554 7423\", site: \"www.rsm.ae\" },\n  kuwait: { name: \"RSM in Kuwait\", phone: \"—\", site: \"www.rsm.global/kuwait\" },\n  ksa: { name: \"RSM Saudi Arabia\", phone: \"—\", site: \"www.rsm.global/ksa\" },\n};\nlet currentTweaks = {...TWEAKS};\n\nfunction applyTweaks(t) {\n  // Entity label swaps (lightweight — doesn't replace addresses since those are UAE-specific in this doc)\n  const entity = ENTITY_MAP[t.entity] || ENTITY_MAP.uae;\n  document.querySelectorAll('[data-entity-name]').forEach(el => { el.textContent = entity.name; });\n\n  // Density\n  const r = {\n    compact: { pad: \"48px\", gap: \"16px\" },\n    comfortable: { pad: \"64px\", gap: \"24px\" },\n    roomy: { pad: \"96px\", gap: \"32px\" }\n  }[t.density] || { pad: \"64px\", gap: \"24px\" };\n  document.querySelectorAll('section.band').forEach(s => s.style.paddingTop = s.style.paddingBottom = r.pad);\n\n  // Seg button states\n  document.querySelectorAll('#tweaks-panel .t-seg').forEach(g => {\n    const k = g.dataset.key;\n    g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === t[k]));\n  });\n}\napplyTweaks(currentTweaks);\n\ndocument.querySelectorAll('#tweaks-panel .t-seg').forEach(group => {\n  group.addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    currentTweaks[group.dataset.key] = b.dataset.val;\n    applyTweaks(currentTweaks);\n    try { window.parent.postMessage({type: '__edit_mode_set_keys', edits: currentTweaks}, '*'); } catch(e){}\n  });\n});\n\nwindow.addEventListener('message', (e) => {\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('on');\n  if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('on');\n});\nwindow.parent.postMessage({type: '__edit_mode_available'}, '*');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
